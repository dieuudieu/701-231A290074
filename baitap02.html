  <main class="wrap">
   <section class="heading">
    <span class="eyebrow">
     BÀI TẬP 02 · 20 ĐIỂM
    </span>
    <h2>
     Đăng ký tài khoản
    </h2>
    <p>
     Nhập đầy đủ thông tin để kiểm tra tính hợp lệ.
    </p>
   </section>
   <section class="panel form-panel">
    <form id="registerForm" novalidate="">
     <label for="fullName">
      Họ và tên
     </label>
     <input autocomplete="name" id="fullName" placeholder="Nguyễn Văn A" required="" type="text"/>
     <label for="email">
      Email
     </label>
     <input autocomplete="email" id="email" placeholder="example@gmail.com" required="" type="email"/>
     <label for="password">
      Mật khẩu
     </label>
     <input autocomplete="new-password" id="password" placeholder="Ít nhất 8 ký tự, chữ hoa, chữ thường và số" required="" type="password"/>
     <label class="check">
      <input id="terms" type="checkbox"/>
      <span>
       Tôi đồng ý với điều khoản sử dụng
      </span>
     </label>
     <button type="submit">
      Đăng ký
     </button>
     <p aria-live="polite" class="notice" id="registerMessage" role="status">
     </p>
    </form>
   
  </main>
  
  <script defer="" src="js/script.js">
  </script>
